<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 60" width="250" height="60">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes hue-shift {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }
  </style>

  <!-- Logo Mark -->
  <g transform="translate(10, 7)" class="animated-color">
    <!-- Hexagon base -->
    <path d="M22,0 L44,12.5 L44,37.5 L22,50 L0,37.5 L0,12.5 Z" fill="rgba(249, 115, 22, 0.05)" stroke="url(#primaryGrad)" stroke-width="2" />
    
    <!-- Stylized 'S' representing Surya and Code -->
    <path d="M28,14 C28,14 16,14 16,22 C16,28 28,28 28,34 C28,40 16,40 16,40" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Spark / Magic Star -->
    <path d="M34,6 L36,11 L41,13 L36,15 L34,20 L32,15 L27,13 L32,11 Z" fill="url(#primaryGrad)" filter="url(#glow)"/>
  </g>

  <!-- Typography -->
  <text x="70" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="url(#textGrad)" letter-spacing="1">SURYA</text>
  <text x="153" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="url(#primaryGrad)" letter-spacing="0.5" class="animated-color">CS</text>
  
  <!-- Subtle tagline -->
  <text x="72" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#94a3b8" letter-spacing="1.5" text-transform="uppercase">Full Stack Web Solutions</text>
</svg>
